name: ppo_mlp_integral__v1_precise
algo: ppo
total_timesteps: 3000000
n_envs: 16
train_space: train
env:
  obs_integral: true
  sigma_near: 0.05
curriculum:
  start: 0.0
  ramp_fraction: 0.3
eval:
  freq: 250000
  suite: val
  n: null
normalize:
  obs: true
  reward: true
  clip_obs: 10.0
lr_schedule: linear
algo_kwargs:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
policy_kwargs:
  net_arch:
    pi:
    - 128
    - 128
    vf:
    - 128
    - 128
  activation_fn: tanh
  log_std_init: -1.0
  lstm_hidden_size: 64
  n_lstm_layers: 1
  shared_lstm: false
  enable_critic_lstm: true
variants:
- v1_precise
