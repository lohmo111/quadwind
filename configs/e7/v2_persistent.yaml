# E7 / V2: устойчивые скрытые факторы — ветер без скачков режима, медленный дрейф (τ 10–20 с), редкие порывы,
# ослабленный мотор вдвое чаще (смещение ЦМ — как в train: до 3 мм PID-tuned падает в 6% эпизодов). Интегрирование/оценка окупается, «реактивность» — меньше.
variant: v2_persistent
space_overrides:
  jump_rate: [0.0, 0.0]
  slow_tau: [10.0, 20.0]
  gust_rate: [0.0, 0.05]
  weak_motor_prob: [0.5, 0.5]
